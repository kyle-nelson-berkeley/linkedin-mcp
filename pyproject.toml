[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "MCP server for propose-then-approve edits to your own LinkedIn profile"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["linkedin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
